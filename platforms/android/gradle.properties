# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# --- Identidade do RetroSystem PS2 (TASK-0017) ---------------------------------
# Defaults do PROJETO, nao flags de linha de comando. O build.gradle.kts le estas
# tres com providers.gradleProperty(...), entao um `./gradlew assembleGithubRelease`
# sem argumento nenhum ja produz a nossa identidade -- e nao e preciso tocar no
# build.gradle.kts deles, o que mantem o merge com o upstream limpo.
#
# Por que sao defaults e nao flags: os defaults do upstream sao com.armsx2 e
# versionCode 1088, e esquecer uma flag publica um APK errado. Um dos dois erros e
# IRREVERSIVEL -- o Android recusa instalar versionCode menor sobre maior, entao um
# 1088 publicado por engano deixa a serie 38, 39... inalcancavel naquele aparelho.
#
# `come.nanodata.armsx2` e grafia herdada, NAO e typo a corrigir: corrigir quebra
# toda instalacao existente.
armsx2.applicationId=come.nanodata.armsx2
armsx2.versionCode=38
armsx2.versionName=1.0.24
