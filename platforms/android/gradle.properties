# --- Identidade do RetroSystem PS2 (TASK-0017) ---------------------------------
# Defaults do PROJETO, nao flags de linha de comando. O build.gradle.kts le estas
# tres com providers.gradleProperty(...), entao um `./gradlew assembleGithubRelease`
# sem argumento nenhum ja produz a nossa identidade -- e nao e preciso tocar no
# build.gradle.kts deles, o que mantem o merge com o upstream limpo.
#
# Por que sao defaults e nao flags: os defaults do upstream sao com.armsx2 e
# versionCode 1088, e esquecer uma flag publica um APK errado. Um dos dois erros e
# IRREVERSIVEL -- o Android recusa instalar versionCode menor sobre maior, entao um
# 1088 publicado por engano deixa a serie 38, 39... inalcancavel naquele aparelho.
#
# `come.nanodata.armsx2` e grafia herdada, NAO e typo a corrigir: corrigir quebra
# toda instalacao existente.
#
# --- Serie de versao do FORK (TASK-0075) ---------------------------------------
# A serie comeca em 2000 / 2.0.0 e nao e continuacao de nada. A LINHA ANTIGA
# (feature/handoff-end-to-end) tem clientes instalados e segue a sua propria serie:
# em 2026-09-02 ela servia 1.0.23 / versionCode 37 em rgs/ps2/, e a proxima dela e 38.
#
#   linha antiga:  37, 38, 39, 40 ...        publica em rgs/ps2/
#   fork (aqui):   2000, 2001, 2002 ...      publica em rgs/ps2fork/
#
# O intervalo entre as duas e proposital: as series NAO PODEM se encontrar. Os dois
# lados compartilham applicationId e certificado de release, entao dois APKs
# diferentes com o mesmo versionCode seriam indistinguiveis para o Android, para o
# suporte e para a telemetria. Esta branch chegou a ficar com `38` -- exatamente o
# proximo numero DELES -- e publicar aquilo teria atualizado todo cliente da 1.0.23
# para o fork.
#
# Baixar este numero e IRREVERSIVEL no aparelho: o Android recusa instalar
# versionCode menor sobre maior. Quem instalar o fork nao volta para a linha antiga
# sem desinstalar (e perder saves e memory cards).
#
# O endpoint de atualizacao que acompanha esta serie esta em app/build.gradle.kts
# (APP_UPDATE_ENDPOINT / APP_UPDATE_CHANNEL). Os tres andam juntos -- mexer em um
# sem os outros e o que mistura as duas trilhas.
armsx2.applicationId=come.nanodata.armsx2
armsx2.versionCode=2005
armsx2.versionName=2.0.5
